name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The matrix legs carry the real gate (typecheck, tests, markdownlint) per
  # Bun runtime: opencode v1 embeds Bun 1.3.14; v2 embeds 1.4.2. The plugin
  # runs inside the host's embedded runtime, so both must pass.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ["1.3.14", "1.4.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install
      - run: bunx tsc -p tsconfig.check.json
      - run: bun test tests/*.test.ts
      - run: bunx markdownlint-cli2

  # Bare-named summary job: the main branch ruleset requires a status check
  # with context "test", and matrix legs report as "test (1.3.14)" etc.,
  # which never satisfies a bare "test" requirement.
  test:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "matrix legs green"
