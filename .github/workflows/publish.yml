name: Publish

on:
  push:
    tags: ["v*"]

# id-token: write lets npm authenticate via GitHub's OIDC token instead of a
# stored secret. Requires a Trusted Publisher configured on npmjs.com for
# this package pointing at sysread/thatch + publish.yml.
permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  # Release gate: the same checks CI runs (the tag push itself does not
  # trigger ci.yml), across the dual-runtime matrix a release must pass on
  # (opencode v1 embeds Bun 1.3.14; v2 embeds 1.4.2).
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ["1.3.14", "1.4.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install
      - run: bunx tsc -p tsconfig.check.json
      - run: bun test tests/*.test.ts
      - run: bunx markdownlint-cli2

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      # OIDC publish needs npm >= 11.5.1. setup-node installs into the
      # user-writable tool cache (the runner's stock node in /usr/local is
      # root-owned, so npm can't self-upgrade there). Deliberately NO
      # registry-url — it writes a token-expecting .npmrc that preempts
      # the OIDC exchange. Pin to npm@11: npm 12.0.0 shipped with a broken
      # sigstore dependency that crashes provenance signing with
      # "Cannot find module 'sigstore'".
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@11
      - run: npm publish --access public

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Publish failed: ${tag}`,
              body: [
                `The publish workflow for \`${tag}\` failed.`,
                ``,
                `[View the failed run](${runUrl})`,
                ``,
                `Check the logs for the failing step. Common causes:`,
                `- npm registry or sigstore/provenance outage`,
                `- Broken npm version (pin npm@11 in the workflow if sigstore is missing)`,
                `- OIDC trusted publisher misconfiguration on npmjs.com`,
                ``,
                `Recovery: fix the workflow, delete and re-tag ${tag} at the fixed commit, push.`,
              ].join('\n'),
              labels: ['publish-failure'],
            });

  # The Claude Code marketplace's plugin branch (the marketplace entry on
  # main points at {source: github, repo: sysread/thatch, ref:
  # plugin-release}). The plugin tree is what prepack generates into the
  # npm tarball - .claude-plugin/plugin.json, hooks/, the slimmed
  # package.json + bun.lock - committed onto this branch at the tag so a
  # plugin install is a git clone of that tree. Installs never touch npm
  # (npm 12 refuses the installer's tarball-URL pack; see
  # docs/user/setup.md), and the dependency install runs bun against the
  # slim lockfile. CI is the branch's ONLY writer; --force is safe (one
  # commit per release, no human work to lose). The top-level workflow
  # permissions pin GITHUB_TOKEN to contents: read, which cannot push -
  # this job needs the write grant below.
  plugin-branch:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun scripts/prepack.ts
      - name: Commit the generated plugin tree
        run: |
          version=$(bun -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json hooks package.json bun.lock
          git commit -m "plugin tree for v${version}"
      - name: Push the plugin-release branch
        run: git push --force origin HEAD:refs/heads/plugin-release

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Plugin branch refresh failed: ${tag}`,
              body: [
                `The plugin-release branch refresh for \`${tag}\` failed.`,
                ``,
                `[View the failed run](${runUrl})`,
                ``,
                `Marketplace installs keep working (they clone the previous`,
                `release's branch head) until this is fixed.`,
                ``,
                `Common causes: branch protection or a ruleset blocking the`,
                `force-push of plugin-release.`,
                ``,
                `Recovery: fix the workflow, delete and re-tag ${tag} at the fixed commit, push.`,
              ].join('\n'),
              labels: ['publish-failure'],
            });
