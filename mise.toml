[env]
# Enable opencode background sub-agents (task tool background:true parameter).
# Gated behind an experimental flag in opencode; without this, the task tool
# strips the `background` parameter from its schema entirely, forcing
# synchronous sub-agent dispatch. Also set in bashrc for global coverage.
OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS = "true"

[tools]
bun = "1.3.14"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.test-watch]
description = "Run tests in watch mode"
run = "bun test --watch"

[tasks.coverage]
description = "Run tests with coverage report"
run = "bun test --coverage --coverage-reporter=text --coverage-reporter=lcov"

[tasks.cli]
description = "Run the thatch CLI (list, show, search, forget)"
run = "bun run bin/thatch"

[tasks.typecheck]
description = "Typecheck src + tests (tsconfig.check.json)"
run = "bunx tsc -p tsconfig.check.json"

[tasks.lint-md]
description = "Lint markdown docs (README.md + docs/, excluding docs/plans)"
run = "bunx markdownlint-cli2"

[tasks.check]
description = "Typecheck, run tests, and lint markdown docs"
run = "bunx tsc -p tsconfig.check.json && bun test tests/*.test.ts && bunx markdownlint-cli2"

[tasks.release]
description = "Bump version, commit, tag, and push (args: patch|minor|major)"
run = "bin/release"

[tasks.qa]
description = "Run QA use-case scenarios in isolated temp environments (auto first, then live). Opencode-driven use cases run one leg per installed opencode major."
run = "bun test tests/qa/auto/index.test.ts --concurrent --max-concurrency 5 && bun test tests/qa/live/index.test.ts"

[tasks.qa-dry-run]
description = "List QA use cases without spawning opencode sessions"
run = "QA_DRY_RUN=1 bun test tests/qa/auto/index.test.ts tests/qa/live/index.test.ts --concurrent --max-concurrency 5"

[tasks.qa-auto]
description = "Run automatable QA use cases inside the docker sandbox (qa/opencode-sandbox: pinned opencode v2, throwaway XDG tree - no host state touched). Pass UC names as args to select a subset (e.g. mise run qa-auto uc-004 uc-008)."
run = "QA_DOCKER=1 bin/qa-run auto"

[tasks.qa-live]
description = "Run live-session QA use cases inside the docker sandbox (spawns opencode, costs model tokens). Pass UC names as args to select a subset (e.g. mise run qa-live uc-001 uc-003)."
run = "QA_DOCKER=1 bin/qa-run live"

[tasks.qa-host-auto]
description = "Run automatable QA against the HOST opencode binary (no docker) - the CI-shaped mode and the v1-binary recipe: PATH=\"$(brew --cellar)/opencode/1.18.32/bin:$PATH\" mise run qa-host-auto."
run = "bin/qa-run auto"

[tasks.qa-host-live]
description = "Run live-session QA against the HOST opencode binary (no docker). v1 coverage lives here: PATH=\"$(brew --cellar)/opencode/1.18.32/bin:$PATH\" mise run qa-host-live."
run = "bin/qa-run live"

[tasks.qa-docker]
description = "Run the LIVE QA use cases inside the docker sandbox (qa/opencode-sandbox: pinned opencode v2, throwaway XDG tree - no host state touched). Builds the image on first use. Pass UC names as args like qa-live. The docker build itself runs on the host; use cases needing a real TUI or the host opencode binary stay on qa-live."
run = "QA_DOCKER=1 bin/qa-run live"

